version: '3.8'

services:
  web:
    build: .
    command: >
      sh -c "python FSSP_site/manage.py migrate &&
             python FSSP_site/manage.py collectstatic --noinput &&
             gunicorn --chdir FSSP_site FSSP_site.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/FSSP_site/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=FSSP_site.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  celery_worker:
    build: .
    command: celery -A FSSP_site worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=FSSP_site.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web
    restart: always

  celery_beat:
    build: .
    command: celery -A FSSP_site beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=FSSP_site.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
  static_volume: 